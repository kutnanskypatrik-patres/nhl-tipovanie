<!doctype html>
<html lang="sk"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220"><title>NHL Tipovanie</title>
<style>
:root{--bg:#eef2f7;--card:#fff;--navy:#0b1220;--muted:#6b7280;--line:#e5e7eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{background:linear-gradient(145deg,#0b1220,#1b2942);color:#fff;padding:22px 16px 18px;text-align:center;box-shadow:0 3px 14px #0002}
.logo{font-size:34px;line-height:1}h1{margin:8px 0 2px;font-size:24px;letter-spacing:.2px}.season{font-size:13px;opacity:.72}
main{max-width:620px;margin:0 auto;padding:14px 12px 28px}.card{background:var(--card);border-radius:18px;box-shadow:0 3px 14px #00000010;overflow:hidden}
.cardhead{padding:16px 16px 10px}.title{font-size:19px;font-weight:800}.updated{font-size:12px;color:var(--muted);margin-top:4px}
.row{display:grid;grid-template-columns:48px 1fr 76px;align-items:center;gap:8px;padding:14px 16px;border-top:1px solid var(--line);min-height:66px}
.row.top{background:#fafafa}.pos{font-size:21px;font-weight:800;text-align:center}.name{font-size:16px;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.points{font-size:20px;font-weight:850;text-align:right}.ptslabel{display:block;font-size:10px;font-weight:500;color:var(--muted);margin-top:1px}
.status{padding:16px;color:var(--muted);text-align:center;font-size:14px}.error{color:#b91c1c;text-align:left;line-height:1.45}
footer{text-align:center;color:#9ca3af;font-size:11px;padding:15px}@media(max-width:380px){.row{grid-template-columns:40px 1fr 68px;padding-left:12px;padding-right:12px}}
</style></head><body>
<header><div class="logo">🏒</div><h1>NHL TIPOVANIE</h1><div class="season">2026 / 2027</div></header>
<main><section class="card"><div class="cardhead"><div class="title">🏆 Priebežné poradie</div><div id="updated" class="updated">Načítavam údaje…</div></div>
<div id="table" class="status">Načítavam…</div></section><footer>Údaje sa automaticky obnovujú každých 30 sekúnd.</footer></main>
<script>
const CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vTEW8YvbL3g9kEMJZANuADhkg_ah61vnVrg-1iCqsI_CITLiHXiw4j4uuRKT8lEyQ/pub?output=csv';
function parseCSV(t){const rows=[];let row=[],cell="",q=false;for(let i=0;i<t.length;i++){const c=t[i],n=t[i+1];if(c=='"'&&q&&n=='"'){cell+='"';i++;continue}if(c=='"'){q=!q;continue}if(c==','&&!q){row.push(cell);cell='';continue}if((c=='\n'||c=='\r')&&!q){if(c=='\r'&&n=='\n')i++;row.push(cell);cell='';if(row.some(v=>v.trim()!==''))rows.push(row);row=[];continue}cell+=c}if(cell!==''||row.length){row.push(cell);rows.push(row)}return rows}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])}
async function load(){try{const r=await fetch(CSV_URL+'&_='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Google Sheets vrátil chybu '+r.status+'.');const rows=parseCSV(await r.text());const data=rows.slice(1).map(r=>({name:(r[1]||'').trim(),points:Number((r[2]||'0').replace(',','.'))||0})).filter(x=>x.name);data.sort((a,b)=>b.points-a.points);if(!data.length){document.getElementById('table').innerHTML='<div class="status">Nenašli sa žiadne mená v stĺpci B.</div>';return}document.getElementById('table').innerHTML=data.map((x,i)=>{const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);return `<div class="row ${i<3?'top':''}"><div class="pos">${medal}</div><div class="name">${esc(x.name)}</div><div class="points">${x.points}<span class="ptslabel">BODY</span></div></div>`}).join('');document.getElementById('updated').textContent='Aktualizované o '+new Date().toLocaleTimeString('sk-SK',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}catch(e){document.getElementById('table').innerHTML='<div class="status error"><b>Nepodarilo sa načítať údaje.</b><br>'+esc(e.message)+'</div>';document.getElementById('updated').textContent='Chyba pri načítaní'}}
load();setInterval(load,30000);
</script></body></html>
