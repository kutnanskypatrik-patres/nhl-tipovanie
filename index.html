<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NHL Rivality Košice</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#f1f3f6;color:#17243a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{overflow-x:hidden}

.header{width:100%;background:#06172b;overflow:hidden}
.banner{width:100%;height:250px;background:#06172b;display:flex;justify-content:center;align-items:center;overflow:hidden}
.banner img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center center;
}

.nav-wrap{background:#fff;border-bottom:1px solid #d7dde6;overflow-x:auto;-webkit-overflow-scrolling:touch}
.nav{display:flex;gap:10px;min-width:max-content;padding:10px 15px;justify-content:center}
.nav a{text-decoration:none;color:#17243a;background:#fff;border:2px solid #dce2ea;border-radius:17px;padding:13px 22px;font-weight:700;font-size:17px;white-space:nowrap}
.nav a.active{background:#0b1d34;color:#fff;border-color:#0b1d34}

.card{margin:24px auto;max-width:1050px;background:#fff;border-radius:24px;padding:25px;box-shadow:0 2px 12px rgba(0,0,0,.05)}
h1{margin:0 0 5px;font-size:32px}
.subtitle{margin:0 0 28px;color:#71809a;font-size:20px}

.table-wrap{overflow-x:auto;border-radius:20px}
table{width:100%;min-width:600px;border-collapse:separate;border-spacing:0;overflow:hidden}
th{background:#0b1d34;color:#fff;padding:22px 16px;font-size:20px;text-align:center}
td{padding:20px 16px;text-align:center;border-bottom:1px solid #dce2ea;color:#70809b;font-size:19px;font-weight:600}
th:first-child{border-top-left-radius:20px}
th:last-child{border-top-right-radius:20px}
tr:last-child td:first-child{border-bottom-left-radius:20px}
tr:last-child td:last-child{border-bottom-right-radius:20px}

@media (max-width:700px){
  .banner{height:150px}
  .banner img{width:100%;height:100%;object-fit:cover;object-position:center center}
  .nav{justify-content:flex-start;padding:9px 12px}
  .nav a{font-size:15px;padding:11px 16px;border-radius:14px}
  .card{margin:14px 10px;padding:18px;border-radius:18px}
  h1{font-size:26px}
  .subtitle{font-size:17px;margin-bottom:20px}
  th{font-size:16px;padding:17px 12px}
  td{font-size:16px;padding:17px 12px}
}

@media (max-width:430px){
  .banner{height:128px}
  .banner img{object-position:center center}
}
</style>
</head>
