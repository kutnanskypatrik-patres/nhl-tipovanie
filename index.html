<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NHL RIVALITY KOVARCE</title>
<style>
:root{--navy:#0b1628;--bg:#f2f4f7;--text:#122033;--line:#dfe4ea}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
.hero{min-height:118px;display:flex;align-items:center;gap:28px;padding:18px 5%;background:linear-gradient(110deg,#071321,#152943 52%,#071321);color:#fff;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;left:15%;right:5%;bottom:8px;height:3px;background:linear-gradient(90deg,transparent,#e31b23,#fff,#e31b23,transparent)}
.nhl-badge{width:82px;height:92px;display:grid;place-items:center;flex:none}
.nhl-badge img{width:78px;height:88px;object-fit:contain;filter:drop-shadow(0 3px 6px #0008)}
.hero h1{margin:0;font-size:clamp(30px,4vw,56px);font-style:italic;letter-spacing:-1px}
.hero h1 span{display:block;width:max-content;max-width:100%;border-bottom:4px solid #e31b23;padding-bottom:3px}
.nav-wrap{background:#fff;border-bottom:1px solid #ddd;padding:12px 4%;position:sticky;top:0;z-index:10}
.nav{max-width:1250px;margin:auto;display:flex;gap:10px;flex-wrap:wrap}
.nav button{border:1px solid #d8dee6;background:#fff;color:#17243a;border-radius:10px;padding:12px 18px;font-size:15px;font-weight:700;cursor:pointer}
.nav button.active,.nav button:hover{background:var(--navy);color:#fff}
main{max-width:1250px;margin:28px auto;padding:0 18px}
.card{background:#fff;border-radius:18px;box-shadow:0 5px 22px #17243a12;padding:22px;margin-bottom:22px}
.card h2{margin:0 0 4px;font-size:28px}
.updated{color:#728096;font-size:14px;margin-bottom:16px}
.loading{text-align:center;padding:35px;color:#728096}
.error{padding:14px;border-radius:10px;background:#fff1f1;color:#9b2020}
.hidden{display:none}
footer{text-align:center;color:#8190a5;padding:28px}

.table-wrap{overflow:auto;-webkit-overflow-scrolling:touch}
.standings-table{width:100%;border-collapse:separate;border-spacing:0 2px;table-layout:fixed}
.standings-table thead th{background:linear-gradient(180deg,#142943,#0b1628);color:#fff;padding:13px 14px;text-align:left;font-size:15px}
.standings-table thead th:first-child{border-radius:9px 0 0 9px;text-align:center;width:64px}
.standings-table thead th:last-child{border-radius:0 9px 9px 0;text-align:right;width:90px}
.standings-table tbody td{padding:8px 14px;background:#fff;font-size:17px;height:52px}
.standings-table tbody tr td:first-child{border-radius:9px 0 0 9px}
.standings-table tbody tr td:last-child{border-radius:0 9px 9px 0}
.standings-table tbody tr:nth-child(even) td{background:#fafbfc}
.standings-table tbody tr.top1 td{background:linear-gradient(90deg,#fff1bf,#fff8e1)}
.standings-table tbody tr.top2 td{background:linear-gradient(90deg,#edf0f3,#f7f8f9)}
.standings-table tbody tr.top3 td{background:linear-gradient(90deg,#f9dfcc,#fff0e6)}
.rank{text-align:center;font-weight:700;font-size:18px}
.medal{font-size:25px;display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px}
.team-cell{display:flex;align-items:center;gap:14px;font-weight:600;min-width:0}
.team-logo{width:46px;height:46px;object-fit:contain;object-position:center;flex:none;display:block}
.points{text-align:right;font-weight:800;font-size:18px}

.standings-title{display:flex;align-items:center;gap:12px}
.standings-title .title-icon{font-size:30px}
.standings-title h2{margin:0;font-size:28px}
.standings-subtitle{color:#728096;font-size:14px;margin:3px 0 16px 37px}

/* VZÁJOMNÉ ZÁPASY */
.head-card{padding:18px}
.head-title{display:flex;align-items:center;gap:10px;margin-bottom:3px}
.head-title h2{margin:0;font-size:27px}
.matrix-wrap{overflow:auto;max-width:100%;border-radius:12px}
.matrix-table{border-collapse:separate;border-spacing:0;min-width:max-content;width:100%;font-size:14px}
.matrix-table th,.matrix-table td{border-right:1px solid #e0e5eb;border-bottom:1px solid #e0e5eb;text-align:center;white-space:nowrap}
.matrix-table thead th{position:sticky;top:0;z-index:3;background:linear-gradient(180deg,#142943,#0b1628);color:#fff;height:86px;padding:7px 8px}
.matrix-table thead th:first-child{left:0;z-index:5;min-width:155px;text-align:left;border-top-left-radius:10px}
.matrix-table tbody td{height:58px;padding:6px 10px;background:#fff;font-weight:700}
.matrix-table tbody tr:nth-child(even) td{background:#fafbfc}
.matrix-table tbody td:first-child{position:sticky;left:0;z-index:2;text-align:left;min-width:155px;background:#fff!important;box-shadow:3px 0 7px #17243a18}
.matrix-table tbody tr:last-child td:first-child{border-bottom-left-radius:10px}
.matrix-table thead th:last-child{border-top-right-radius:10px}
.matrix-table tbody tr:last-child td:last-child{border-bottom-right-radius:10px}
.matrix-team{display:flex;align-items:center;gap:8px}
.matrix-team .team-logo{width:38px;height:38px}
.matrix-header-team{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:65px}
.matrix-header-team .team-logo{width:43px;height:43px;object-fit:contain;display:block}
.matrix-team .team-logo{object-fit:contain;display:block}
.matrix-cell{min-width:65px}
.matrix-cell.diag{background:#eef1f4!important;color:#9aa5b2}
.matrix-cell.win{font-weight:800}
.matrix-empty{color:#aab3bf}
.matrix-score{font-size:15px}

.scoring-note{
  margin-top:16px;
  text-align:left;
  font-size:14px;
  line-height:1.7;
  color:#122033;
}
.scoring-title{
  font-weight:800;
  margin-bottom:3px;
}
.scoring-note strong{font-weight:800}


/* ZÁPASY – moderný NHL prehľad */
.games-card{padding:18px 20px 22px}
.games-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.games-title-icon{font-size:34px;line-height:1}
.games-title h2{margin:0;font-size:28px;line-height:1.15}
.games-updated{margin-top:5px;color:#728096;font-size:14px}
.games-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 12px;flex-wrap:wrap}
.games-filters{display:flex;gap:8px;flex-wrap:wrap}
.games-filter{border:1px solid #d8dee6;background:#fff;color:#17243a;border-radius:9px;padding:9px 15px;font-weight:700;font-size:14px;cursor:pointer}
.games-filter.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.games-table-wrap{overflow:auto;-webkit-overflow-scrolling:touch;border-radius:10px}
.games-table{width:100%;border-collapse:separate;border-spacing:0 2px;min-width:760px;font-size:14px}
.games-table th{background:linear-gradient(180deg,#142943,#0b1628);color:#fff;padding:9px 10px;text-align:center;font-size:14px;white-space:nowrap}
.games-table th:first-child{border-radius:9px 0 0 9px}
.games-table th:last-child{border-radius:0 9px 9px 0}
.games-table td{padding:7px 10px;background:#fff;border:0;text-align:center;white-space:nowrap;height:38px}
.games-table tbody tr:nth-child(even) td{background:#f7f8fa}
.games-table td.date,.games-table td.time{font-variant-numeric:tabular-nums}
.game-team{display:flex;align-items:center;justify-content:center;gap:8px;min-width:135px}
.game-team.home{justify-content:flex-end}
.game-team.away{justify-content:flex-start}
.game-team-logo{width:30px;height:30px;object-fit:contain;display:block;flex:none}
.game-separator{font-weight:700;color:#728096;padding:0 3px}
.game-score{font-weight:800;font-size:15px;min-width:58px}
.game-status{display:inline-flex;align-items:center;justify-content:center;min-width:78px;padding:5px 9px;border-radius:7px;color:#fff;font-weight:700;font-size:12px}
.game-status.played{background:#39a935}
.game-status.unplayed{background:#1769b5}
.game-status.live{background:#d97706}
.games-empty{padding:25px;text-align:center;color:#728096}
@media(max-width:650px){
 .games-card{padding:12px 10px 14px}
 .games-head{gap:8px;margin-bottom:10px}.games-title-icon{font-size:26px}.games-title h2{font-size:21px}.games-updated{font-size:11px}
 .games-toolbar{align-items:stretch;gap:8px}.games-filters{width:100%;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px}.games-filter{white-space:nowrap;padding:8px 11px;font-size:12px}
 .games-table{min-width:720px;font-size:12px}.games-table th{font-size:12px;padding:8px}.games-table td{padding:5px 7px;height:36px}
 .game-team{min-width:125px}.game-team-logo{width:27px;height:27px}.game-score{font-size:13px}.game-status{min-width:70px;padding:4px 7px;font-size:11px}
}

.generic-table{border-collapse:collapse;width:100%;font-size:14px}
.generic-table th{background:var(--navy);color:#fff;padding:10px;text-align:left}
.generic-table td{background:#fff;border-bottom:1px solid #e4e7eb;padding:9px}
.generic-table tr:nth-child(even) td{background:#fafbfc}


/* Jednoduchá tabuľka vzájomných zápasov – číta presne A4:D zo Sheets */
.head-simple-table{table-layout:auto;width:max-content;min-width:100%}
.head-simple-table .rank-head{width:70px;text-align:center!important}
.head-simple-table .logo-head{width:105px;text-align:center!important}
.head-simple-table .team-head,.head-simple-table .sheet-head{text-align:center!important;min-width:68px}
.head-simple-table .value-head{width:70px;text-align:center!important}
.head-simple-table .rank-cell{width:70px;text-align:center;font-weight:700}
.head-simple-table .logo-cell{width:105px;text-align:center}
.head-simple-table .logo-cell .team-logo{width:42px;height:42px;margin:auto;object-fit:contain}
.head-simple-table .team-name-cell{text-align:left;font-weight:700;white-space:normal}
.head-simple-table .value-cell,.head-simple-table .sheet-value-cell{min-width:58px;text-align:center;font-weight:800}
@media(max-width:650px){
 .head-simple-table .rank-head,.head-simple-table .rank-cell{width:38px}
 .head-simple-table .logo-head,.head-simple-table .logo-cell{width:72px}
 .head-simple-table .value-head,.head-simple-table .value-cell{width:48px}
 .head-simple-table .logo-cell .team-logo{width:34px;height:34px}
 .head-simple-table .team-name-cell{font-size:13px;line-height:1.2}
}

@media(max-width:650px){
 .hero{min-height:82px;padding:10px 14px;gap:10px}.nhl-badge{width:48px;height:58px}.nhl-badge img{width:46px;height:54px}
 .hero h1{font-size:24px}.hero h1 span{border-bottom-width:3px}
 .nav-wrap{padding:7px 8px}.nav{gap:6px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
 .nav button{white-space:nowrap;padding:9px 11px;font-size:12px;border-radius:8px}
 main{margin:12px auto;padding:0 8px}.card{border-radius:12px;padding:11px;margin-bottom:12px}
 .standings-title{gap:7px}.standings-title .title-icon{font-size:23px}.standings-title h2{font-size:17px;line-height:1.2}
 .standings-subtitle{font-size:11px;margin:3px 0 9px 30px}
 .standings-table thead th{padding:8px 6px;font-size:12px}.standings-table thead th:first-child{width:38px}
 .standings-table thead th:nth-child(2){width:52px;font-size:0}.standings-table thead th:last-child{width:48px;text-align:center}
 .standings-table tbody td{padding:4px 5px;height:42px;font-size:13px}.rank{font-size:13px}.medal{font-size:20px;width:28px;height:28px}
 .team-cell{gap:6px}.team-logo{width:32px;height:32px}.points{font-size:14px;text-align:center}
 .head-card{padding:10px}.head-title h2{font-size:18px}.matrix-table{font-size:11px}
 .matrix-table thead th{height:72px;padding:4px 5px}.matrix-table thead th:first-child{min-width:112px}
 .matrix-table tbody td{height:48px;padding:4px 6px}.matrix-table tbody td:first-child{min-width:112px}
 .matrix-header-team{min-width:50px;gap:2px;font-size:9px}.matrix-header-team .team-logo{width:30px;height:30px}
 .matrix-team .team-logo{width:28px;height:28px}.matrix-cell{min-width:50px}.matrix-score{font-size:12px}
 footer{padding:16px 8px;font-size:11px}
}
</style>
</head>

<script>
const SPREADSHEET_ID="1mi6E8lHthYRFL-BPL48FkG7vPUYCO9l_";
const SHEETS={standings:"Tabuľka tipovania",games:"Games",head:"Tabuľka vzájomných zápasov",rules:"Pravidlá"};

const TEAM_LOGOS={
 "Trapslanders":"logos/nyi.png",

const TEAM_LOGO_ALIASES={
 "Pittsburgh Penguins":"logos/pit.png",
 "Boston Bruins":"logos/bos.png",
 "New York Rangers":"logos/nyr.png",
 "New York Islanders":"logos/nyi.png",
 "Colorado Avalanche":"logos/col.png",
 "Montréal Canadiens":"logos/mtl.png",
 "Montreal Canadiens":"logos/mtl.png",
 "Buffalo Sabres":"logos/buf.png",

};

const TEAM_NAMES={
 "Trapslanders":"Islanders",
 "Traptreal":"Canadiens",
 "Trappalo":"Sabres",
 "Traphilly":"Flyers",
 "Trapburgh":"Penguins",
 "Trapago":"Blackhawks",
 "Trabayting":"Lightning",
 "Trapers":"Rangers",
 "Traporado":"Avalanche",
 "Trapilers":"Oilers",
 "Trampton":"Bruins"
};

let jsonpCounter=0;

function getSheet(sheet,range=""){
 return new Promise((resolve,reject)=>{
  const cb="__gs_cb_"+(++jsonpCounter),script=document.createElement("script");
  const timeout=setTimeout(()=>{cleanup();reject(new Error("Google Sheets neodpovedá. Skontroluj, či je tabuľka zverejnená na webe."))},15000);
  function cleanup(){clearTimeout(timeout);script.remove();try{delete window[cb]}catch(_){window[cb]=undefined}}
  window[cb]=data=>{cleanup();if(!data||!data.table)reject(new Error("Google Sheets vrátil neplatné údaje."));else resolve(data.table)};
  script.onerror=()=>{cleanup();reject(new Error("Nepodarilo sa pripojiť ku Google Sheets."))};
  const rangePart=range?`&range=${encodeURIComponent(range)}`:"";
  script.src=`https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?sheet=${encodeURIComponent(sheet)}${rangePart}&tqx=${encodeURIComponent(`responseHandler:${cb}`)}&cbust=${Date.now()}`;
  document.head.appendChild(script);
 });
}

function rows(t){return t.rows.map(r=>r.c.map(c=>c&&c.v!=null?c.v:""))}
function headers(t){return t.cols.map(c=>c.label||c.id||"")}
function clean(v){return String(v??"").replace(/\u00A0/g," ").replace(/\s+/g," ").trim()}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function logoFor(v){
 const key=clean(v);
 return TEAM_LOGOS[key]||TEAM_LOGO_ALIASES[key]||"";
}
function shortName(v){return TEAM_NAMES[clean(v)]||clean(v)}

function logoHtml(team,cls="team-logo"){
 const src=logoFor(team);
 return src?`<img class="${cls}" src="${src}" alt="${esc(team)}" loading="eager" onerror="this.style.display='none'">`:"";
}

async function loadStandings(){
 const el=document.getElementById("standingsContent");
 try{
  const t=await getSheet(SHEETS.standings,"A4:D"),r=rows(t);
  const d=r.filter(x=>x.some(Boolean)).map(x=>({rank:x[0]||"",team:clean(x[2]||""),points:Number(String(x[3]??"").replace(",","."))||0})).filter(x=>x.team);
  el.innerHTML=`<div class="table-wrap"><table class="standings-table"><thead><tr><th class="rank">#</th><th>Tím / Meno</th><th class="points">Body</th></tr></thead><tbody>${
   d.map((x,i)=>{
    const rank=Number(x.rank)||i+1,medal=rank===1?"🥇":rank===2?"🥈":rank===3?"🥉":rank,cls=rank===1?"top1":rank===2?"top2":rank===3?"top3":"";
    return `<tr class="${cls}"><td class="rank">${rank<=3?`<span class="medal">${medal}</span>`:rank}</td><td><div class="team-cell">${logoHtml(x.team)}<span>${esc(x.team)}</span></div></td><td class="points">${x.points}</td></tr>`;
   }).join("")
  }</tbody></table></div>`;
  document.getElementById("standingsUpdated").textContent="Aktualizované: "+new Date().toLocaleString("sk-SK");
 }catch(e){el.innerHTML=`<div class="error">Nepodarilo sa načítať Google Sheets: ${esc(e.message)}</div>`}
}

/*
  VZÁJOMNÉ ZÁPASY:
  Z Google Sheets načítame všetky stĺpce od Tím až po Body.
  Medzi # a Tím vložíme logo z priečinka logos/.
*/
async function loadHeadToHead(){
  const el=document.getElementById("headContent");
  try{
    const t=await getSheet(SHEETS.head);
    const allRows=rows(t);
    const sheetHeaders=headers(t);

    const knownTeams=[
      "Pittsburgh Penguins","Boston Bruins","New York Rangers",
      "New York Islanders","Colorado Avalanche","Montréal Canadiens",
      "Montreal Canadiens","Buffalo Sabres","Edmonton Oilers",
      "Chicago Blackhawks","Tampa Bay Lightning","Philadelphia Flyers"
    ];

    const isTeam=v=>{
      const s=clean(v).toLowerCase();
      return knownTeams.some(n=>n.toLowerCase()===s) || !!logoFor(v);
    };

    // Nájdeme stĺpec Tím podľa skutočných údajov v Google Sheets.
    let teamCol=-1;
    outer:
    for(const row of allRows){
      for(let c=0;c<row.length;c++){
        if(isTeam(row[c])){
          teamCol=c;
          break outer;
        }
      }
    }
    if(teamCol<0) throw new Error("V Google Sheets sa nepodarilo nájsť stĺpec s názvami tímov.");

    const rankCol=Math.max(0,teamCol-2);

    // Nájdeme posledný stĺpec, ktorý chceme zobraziť: až po Body.
    // Ak sa hlavička Body nenájde, použije sa posledný stĺpec s údajmi.
    const normHeader=v=>clean(v).toLowerCase().replace(/\s+/g," ");
    let bodyCol=-1;
    for(let c=teamCol;c<sheetHeaders.length;c++){
      if(normHeader(sheetHeaders[c])==="body" || normHeader(sheetHeaders[c]).startsWith("body")){
        bodyCol=c;
        break;
      }
    }
    if(bodyCol<0){
      for(let c=sheetHeaders.length-1;c>=teamCol;c--){
        if(sheetHeaders[c] || allRows.some(r=>clean(r[c]??"")!=="")){ bodyCol=c; break; }
      }
    }
    if(bodyCol<teamCol) bodyCol=teamCol;

    // Tím musí byť prvý zo zdrojových stĺpcov, potom všetky ďalšie až po Body.
    const sourceCols=[];
    for(let c=teamCol;c<=bodyCol;c++){
      sourceCols.push({index:c,label:clean(sheetHeaders[c]||"")});
    }

    const data=allRows.map((row,i)=>{
      const team=clean(row[teamCol]??"");
      return {
        sourceIndex:i,
        rank:clean(row[rankCol]??""),
        team,
        values:sourceCols.map(col=>clean(row[col.index]??""))
      };
    }).filter(x=>x.team && isTeam(x.team) && !x.team.toLowerCase().includes("bodovanie"));

    if(!data.length){
      el.innerHTML="<div class='error'>Tabuľka vzájomných zápasov je v Google Sheets prázdna.</div>";
      return;
    }

    // Hlavičky: # | Logo | Tím | Z | ... | Body
    let html=`<div class="matrix-wrap"><table class="matrix-table head-simple-table">
      <thead><tr>
        <th class="rank-head">#</th>
        <th class="logo-head">Logo</th>`;

    sourceCols.forEach((col,i)=>{
      let label=col.label;
      if(!label) label=i===0?"Tím":"";
      html+=`<th class="sheet-head">${esc(label)}</th>`;
    });

    html+=`</tr></thead><tbody>`;

    data.forEach((x,i)=>{
      const rank=Number(String(x.rank).replace(",", "."))||i+1;
      html+=`<tr>
        <td class="rank-cell">${rank}</td>
        <td class="logo-cell">${logoHtml(x.team,"team-logo")}</td>`;
      x.values.forEach((value,j)=>{
        const colIndex=sourceCols[j].index;
        const cls=j===0?"team-name-cell":"sheet-value-cell";
        const display=value===""?"—":esc(value);
        html+=`<td class="${cls}" data-col="${colIndex}">${display}</td>`;
      });
      html+=`</tr>`;
    });

    html+=`</tbody></table></div>
      <div class="scoring-note">
        <div class="scoring-title">Bodovanie:</div>
        <div>Výhra v riadnom hracom čase (V) – <strong>2b</strong></div>
        <div>Prehra v riadnom hracom čase (P) – <strong>0b</strong></div>
        <div>Výhra po predĺžení (VP) – <strong>2b</strong></div>
        <div>Prehra po predĺžení (PP) – <strong>1b</strong></div>
      </div>`;

    el.innerHTML=html;
  }catch(e){
    el.innerHTML=`<div class="error">Nepodarilo sa načítať Google Sheets: ${esc(e.message)}</div>`;
  }
}
let gamesData=[];
let gamesFilter='all';

function normalizeHeader(v){return clean(v).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function findCol(headersList, patterns){
 const hs=headersList.map(normalizeHeader);
 for(const p of patterns){const i=hs.findIndex(h=>h===p || h.includes(p));if(i>=0)return i;}
 return -1;
}
function teamShort(v){
 const s=clean(v);
 const map={
  'Pittsburgh Penguins':'Penguins','Boston Bruins':'Bruins','New York Rangers':'Rangers','New York Islanders':'Islanders',
  'Colorado Avalanche':'Avalanche','Montréal Canadiens':'Canadiens','Montreal Canadiens':'Canadiens','Buffalo Sabres':'Sabres',
  'Edmonton Oilers':'Oilers','Chicago Blackhawks':'Blackhawks','Tampa Bay Lightning':'Lightning','Philadelphia Flyers':'Flyers'
 };
 return map[s]||TEAM_NAMES[s]||s;
}
function parseGameDate(v){
 const s=clean(v);
 if(!s)return null;
 const gm=s.match(/^Date\((\d{4}),(\d{1,2}),(\d{1,2})/);
 if(gm)return new Date(Number(gm[1]),Number(gm[2]),Number(gm[3]));
 let d=new Date(s);
 if(!isNaN(d))return d;
 const m=s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})$/);
 if(m)return new Date(Number(m[3]),Number(m[2])-1,Number(m[1]));
 return null;
}
function formatGameDate(v){
 const d=v instanceof Date?v:parseGameDate(v);
 if(!d || isNaN(d)) return clean(v);
 return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
}
function formatGameTime(v){
 const s=clean(v);
 if(!s)return '';
 // Google Sheets môže vrátiť čas ako Date(1899,11,30,h,m,s).
 const gm=s.match(/^Date\(\d{4},\d{1,2},\d{1,2},(\d{1,2}),(\d{1,2})/);
 if(gm){
   return `${String(Number(gm[1])).padStart(2,'0')}:${String(Number(gm[2])).padStart(2,'0')} hod`;
 }
 // Ak je čas už napr. 2:00 alebo 02:00, iba ho upravíme na HH:MM hod.
 const tm=s.match(/^(\d{1,2}):(\d{1,2})/);
 if(tm){
   return `${String(Number(tm[1])).padStart(2,'0')}:${String(Number(tm[2])).padStart(2,'0')} hod`;
 }
 return s;
}
function gameStatus(rawStatus, homeGoals, awayGoals, date){
 const s=normalizeHeader(rawStatus);
 if(s.includes('odohran')||s.includes('played')||s.includes('finished')||s.includes('final'))return 'played';
 if(s.includes('prebieh')||s.includes('live')||s.includes('ongoing'))return 'live';
 if(s.includes('nehran')||s.includes('upcoming')||s.includes('scheduled'))return 'unplayed';
 if(clean(homeGoals)!=='' || clean(awayGoals)!=='')return 'played';
 return 'unplayed';
}
function renderGames(){
 const box=document.getElementById('gamesContent');
 const filtered=gamesData.filter(g=>gamesFilter==='all'||g.status===gamesFilter);
 if(!filtered.length){box.innerHTML='<div class="games-empty">Pre zvolený filter nie sú v Google Sheets žiadne zápasy.</div>';return;}
 box.innerHTML=`<div class="games-table-wrap"><table class="games-table"><thead><tr><th>Dátum</th><th>Čas (SVK)</th><th>Domáci</th><th>Hostia</th><th>Výsledok</th><th>Stav</th></tr></thead><tbody>${filtered.map(g=>{
   const statusText=g.rawStatus || (g.status==='played'?'Odohrané':g.status==='live'?'Prebieha':'Nehrané');
   const statusClass=g.status==='played'?'played':g.status==='live'?'live':'unplayed';
   const score=(g.homeGoals!==''||g.awayGoals!=='')?`${esc(g.homeGoals)} : ${esc(g.awayGoals)}`:'- : -';
   return `<tr><td class="date">${esc(formatGameDate(g.dateObj||g.date))}</td><td class="time">${esc(formatGameTime(g.time))}</td><td><div class="game-team home"><span>${esc(teamShort(g.home))}</span>${logoHtml(g.home,'game-team-logo')}</div></td><td><div class="game-team away">${logoHtml(g.away,'game-team-logo')}<span>${esc(teamShort(g.away))}</span></div></td><td class="game-score">${score}</td><td><span class="game-status ${statusClass}">${esc(statusText)}</span></td></tr>`;
 }).join('')}</tbody></table></div>`;
}

async function loadGames(){
 const box=document.getElementById('gamesContent');
 try{
  const t=await getSheet(SHEETS.games),h=headers(t),r=rows(t).filter(x=>x.some(v=>clean(v)!==''));
  const dc=findCol(h,['datum','date']),tc=findCol(h,['cas','time']);
  const hc=findCol(h,['domaci','home']),ac=findCol(h,['hostia','away']);
  const rc=findCol(h,['vysledok','result','score']);
  const hgc=findCol(h,['domaci goly','home goals','home score']);
  const agc=findCol(h,['hostia goly','away goals','away score']);
  const sc=findCol(h,['stav','status']);
  if(hc<0||ac<0) throw new Error('V Google Sheets sa nepodarilo nájsť stĺpce Domáci a Hostia.');
  gamesData=r.map(row=>{
    const date=dc>=0?clean(row[dc]):'';
    const dateObj=parseGameDate(date);
    let homeGoals=hgc>=0?clean(row[hgc]):'';
    let awayGoals=agc>=0?clean(row[agc]):'';
    if((homeGoals===''||awayGoals==='')&&rc>=0){
      const score=clean(row[rc]);
      const m=score.match(/(\d+)\s*[:\-]\s*(\d+)/);
      if(m){homeGoals=m[1];awayGoals=m[2];}
    }
    const rawStatus=sc>=0?clean(row[sc]):'';
    return {date,time:tc>=0?clean(row[tc]):'',home:clean(row[hc]),away:clean(row[ac]),homeGoals,awayGoals,rawStatus,dateObj,status:gameStatus(rawStatus,homeGoals,awayGoals,dateObj)};
  }).filter(g=>g.home||g.away);
  document.getElementById('gamesUpdated').textContent='Aktualizované: '+new Date().toLocaleString('sk-SK');
  renderGames();
 }catch(e){box.innerHTML=`<div class="error">Nepodarilo sa načítať Google Sheets: ${esc(e.message)}</div>`;}
}


async function loadRules(){
 const el=document.getElementById("rulesContent");
 try{
  const t=await getSheet(SHEETS.rules),r=rows(t);
  el.innerHTML=r.filter(x=>x.some(Boolean)).map(x=>`<p>${x.map(esc).join(" ")}</p>`).join("");
 }catch(e){el.innerHTML=`<div class="error">Nepodarilo sa načítať pravidlá: ${esc(e.message)}</div>`}
}

document.querySelectorAll('.games-filter').forEach(btn=>btn.addEventListener('click',()=>{
 document.querySelectorAll('.games-filter').forEach(b=>b.classList.remove('active'));
 btn.classList.add('active');
 gamesFilter=btn.dataset.gameFilter;
 renderGames();
}));

document.querySelectorAll(".nav button").forEach(btn=>btn.addEventListener("click",()=>{
 document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
 btn.classList.add("active");
 document.querySelectorAll(".page").forEach(p=>p.classList.add("hidden"));
 document.getElementById(btn.dataset.page).classList.remove("hidden");
 if(btn.dataset.page==="games")loadGames();
 if(btn.dataset.page==="head")loadHeadToHead();
 if(btn.dataset.page==="rules")loadRules();
}));

loadStandings();
loadHeadToHead();
